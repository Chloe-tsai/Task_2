<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>product_list</title>
    <!-- bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- style -->
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/product_list.css">
</head>
<body>
    <div class="wrapper">
        <!-- Start header -->
         <header class="header">
            <nav class="navbar mb-32">
                <div class="container py-16 ">
                    <ul class="nav_list">
                        <li class="pr-48">
                        <img src="https://raw.githubusercontent.com/hexschool/2022-web-layout-training/73cf206013997d2173d20441794095af8b1ee3b9/2025-week1/logo.svg" alt="URBNSTEP" class="" >
                        </li>
                        <li class="nav_item">
                            <a href="#!" class="nav_link pr-40 ">商品列表</a>
                        </li>
                        <li class="nav_item">
                            <a href="#!" class="nav_link">品牌故事</a>
                        </li>
                    </ul>
                    <a href="#!" class="nav_person"><i class="bi bi-person"></i></a>
                </div>
            </nav>
         </header>
        <!-- End header -->

        <!-- Start main -->
         <main class="container py-32 mb-48">
            <ol class="breadcrumb">
                <li class="breadcrumb-item">
                    <a href="index" class="breadcrumb-link">首頁</a>
                </li>
                <li class="breadcrumb-item mb-32">所有商品</li>
            </ol>
            <h1 class="h3 mb-24 ">所有商品</h1>
            <div class="row">
                <!-- products_nav -->
                <div class="col-2">
                    <nav class="products_nav">
                        <ul class="products_nav_item">
                            <li class="mb-16">
                                <a href="#!" class="py-12 active">所有商品</a>
                            </li>
                            <li class="mb-16">
                                <a href="#!" class="py-12">慢跑鞋</a>
                            </li>
                            <li class="mb-16">
                                <a href="#!" class="py-12">滑板鞋</a>
                            </li>
                            <li class="mb-16">
                                <a href="#!" class="py-12">厚底鞋</a>
                            </li>
                            <li class="mb-16">
                                <a href="#!">限定/聯名企劃</a>
                            </li>
                        </ul>
                    </nav>
                </div>
                <!-- products_list -->
                <div class="col-10">
                    <div class="row">
                        <div class="col-4">
                            <div class="product_list_item mb-48">
                                <a href="products_detail.html">
                                    <img src="./img/product_list/image.png" alt="PLATFORM 404" class="mb-12">
                                    <h2 class="h6 mb-4">PLATFORM 404</h2>
                                    <p>NT$2,600</p>
                                </a>
                            </div>
                         </div>  
                            <div class="col-4">
                                <div class="product_list_item mb-48">
                                    <a href="products_detail.html">
                                        <img src="./img/product_list/product-1.png" alt="PLATFORM 404" class="mb-12">
                                        <h2 class="h6 mb-4">PLATFORM 404</h2>
                                        <p>NT$2,600</p>
                                    </a>
                                </div>
                            </div>    
                            <div class="col-4">
                                <div class="product_list_item mb-48">
                                    <a href="products_detail.html">
                                        <img src="./img/product_list/product-2.png" alt="PLATFORM 404" class="mb-12">
                                        <h2 class="h6 mb-4">VM001</h2>
                                        <p>NT$2,600</p>
                                    </a>
                                </div>
                            </div>    
                            <div class="col-4">
                                <div class="product_list_item mb-48">
                                    <a href="products_detail.html">
                                        <img src="./img/product_list/product-3.png" alt="PLATFORM 404" class="mb-12">
                                        <h2 class="h6 mb-4">Melty Kiss</h2>
                                        <p>NT$4,000</p>
                                    </a>
                                </div>
                            </div>    
                            <div class="col-4">
                                <div class="product_list_item mb-48">
                                    <a href="products_detail.html">
                                        <img src="./img/product_list/product-4.png" alt="PLATFORM 404" class="mb-12">
                                        <h2 class="h6 mb-4">BOOMBLOK</h2>
                                        <p>NT$3,200</p>
                                    </a>
                                </div>
                            </div>    
                            <div class="col-4">
                                <div class="product_list_item mb-48">
                                    <a href="products_detail.html">
                                        <img src="./img/product_list/product-5.png" alt="PLATFORM 404" class="mb-12">
                                        <h2 class="h6 mb-4">BOOMBLOK</h2>
                                        <p>NT$3,200</p>
                                    </a>
                                </div>
                            </div>    
                            <div class="col-4">
                                <div class="product_list_item mb-48">
                                    <a href="products_detail.html">
                                        <img src="./img/product_list/product-6.png" alt="PLATFORM 404" class="mb-12">
                                        <h2 class="h6 mb-4">R:UNER</h2>
                                        <p>NT$4,000</p>
                                    </a>
                                </div>
                            </div>    
                            <div class="col-4">
                                <div class="product_list_item mb-48">
                                    <a href="products_detail.html">
                                        <img src="./img/product_list/product-7.png" alt="PLATFORM 404" class="mb-12">
                                        <h2 class="h6 mb-4">Sugar Snap</h2>
                                        <p>NT$4,000</p>
                                    </a>
                                </div>
                            </div>    
                            <div class="col-4">
                                <div class="product_list_item mb-48">
                                    <a href="products_detail.html">
                                        <img src="./img/product_list/product-8.png" alt="PLATFORM 404" class="mb-12">
                                        <h2 class="h6 mb-4">Neofoam</h2>
                                        <p>NT$4,000</p>
                                    </a>
                                </div>
                            </div>                     
                        </div>
                        <!-- pagination -->
                        <div class="pagination">
                            <ul class="pages">
                                <li class="page-item mr-12">
                                    <button type="button" class="btn disabled">
                                        <i class="bi bi-chevron-left"></i>
                                    </button>
                                </li>
                                <li class="page-item mr-8">
                                    <button type="button" class="btn active">
                                    1
                                    </button>
                                </li>
                                <li class="page-item mr-8">
                                    <button type="button" class="btn">
                                    2
                                    </button>
                                </li>
                                <li class="page-item mr-8">
                                    <button type="button" class="btn">
                                    3
                                    </button>
                                </li>
                                <li class="page-item mr-8">
                                    <button type="button" class="btn">
                                    ...
                                    </button>
                                </li>
                                <li class="page-item mr-8">
                                    <button type="button" class="btn">
                                    10
                                    </button>
                                </li>
                                <li class="page-item ml-12">
                                    <button type="button" class="btn">
                                        <i class="bi bi-chevron-right"></i>
                                    </button>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
 
        </main>
        <!-- banner -->
        <div class="banner py-24">
            <p class="h4 mr-24">加入會員取得 9 折優惠</p>
            <button type="button" class="btn btn-dark">馬上註冊</button>
        </div>
        <!-- End main -->

        <!-- Start footer -->
        <footer class="footer">
            <div class="container py-16">
                <ul class="footer_list">
                    <li></li>



                </ul>
            </div>
        </footer>
    </div>
    
</body>
</html>
